name: ci
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: pw, POSTGRES_DB: arogya }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test against real PostgreSQL
        env: { DATABASE_URL: "postgres://postgres:pw@localhost:5432/arogya", AROGYA_DEMO: "1", PORT: "8080" }
        run: |
          node server/main.ts &
          for i in $(seq 30); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf -XPOST localhost:8080/api/login -H 'content-type: application/json' -d '{"username":"mehta","password":"arogya-demo-2026"}' | grep -q token
