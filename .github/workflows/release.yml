name: release
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npm run build
      - name: Package
        run: |
          V=${GITHUB_REF_NAME:-dev}
          npm ci --omit=dev
          D=arogya-$V; mkdir -p $D/web
          cp -r server data package.json package-lock.json LICENSE README.md node_modules $D/
          cp -r web/dist $D/web/dist
          tar czf $D.tar.gz $D && zip -qr $D.zip $D
          sha256sum $D.tar.gz $D.zip > SHA256SUMS
      - name: Smoke test the package
        run: |
          mkdir /tmp/t && tar xzf arogya-*.tar.gz -C /tmp/t && cd /tmp/t/arogya-*
          AROGYA_DEMO=1 AROGYA_DATA=/tmp/pgdata PORT=8081 node server/main.ts &
          for i in $(seq 40); do curl -sf localhost:8081/health && break; sleep 1; done
          curl -sf localhost:8081/ | grep -q "<title>Arogya"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            arogya-*.tar.gz
            arogya-*.zip
            SHA256SUMS
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          generate_release_notes: true
